name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_name: mfas
            archive_ext: tar.gz
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: mfas.exe
            archive_ext: zip
          - name: macOS x86_64
            os: macos-13
            target: x86_64-apple-darwin
            binary_name: mfas
            archive_ext: tar.gz
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            binary_name: mfas
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build CLI Binary
        shell: bash
        run: |
          cargo build --release --bin mfas --target ${{ matrix.platform.target }}

      - name: Package CLI Archive
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
          fi

          DIST_DIR="dist-cli"
          mkdir -p "$DIST_DIR"

          BIN_PATH="target/${{ matrix.platform.target }}/release/${{ matrix.platform.binary_name }}"
          ARCHIVE_NAME="mfas-${TAG}-${{ matrix.platform.target }}.${{ matrix.platform.archive_ext }}"

          if [ "${{ matrix.platform.archive_ext }}" = "zip" ]; then
            7z a "$DIST_DIR/$ARCHIVE_NAME" "./$BIN_PATH" README.md LICENSE "Address Format.md"
          else
            tar -czvf "$DIST_DIR/$ARCHIVE_NAME" -C "target/${{ matrix.platform.target }}/release" "${{ matrix.platform.binary_name }}"
          fi

          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform.target }}
          path: dist-cli/*
          if-no-files-found: error

  build-gui:
    name: Build Desktop GUI (${{ matrix.platform.os }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
          - os: windows-latest
          - os: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        working-directory: apps/mfas-desktop
        run: npm install

      - name: Resolve Release Tag
        id: tag_step
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/mfas-desktop
          tagName: ${{ steps.tag_step.outputs.tag }}
          releaseName: 'MFAS Desktop __VERSION__'
          releaseBody: 'See release assets for cross-platform CLI binaries and Desktop installers.'
          releaseDraft: true
          prerelease: false

  publish-release:
    name: Publish Release Assets & Checksums
    needs: [build-cli, build-gui]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Tag
        id: tag_step
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: 'cli-*'
          merge-multiple: true

      - name: Compute SHA-256 Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt || shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.tag_step.outputs.tag }}
          name: MFAS Release ${{ steps.tag_step.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            release-assets/*
          generate_release_notes: true
