[package]
name = "mfas-cli"
version = "0.1.0"
edition = "2021"
description = "Mathematical File Address Space - CLI Application"

[[bin]]
name = "mfas"
path = "src/main.rs"

[dependencies]
mfas-core = { path = "../mfas-core" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
sha2 = "0.10"
